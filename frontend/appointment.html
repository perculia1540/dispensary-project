<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment - MUST Dispensary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <div class="logo">
                MUST Dispensary
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="appointment.html">Appointment</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>
    </header>


    <!-- Appointment Section -->
    <section class="appointment-section">

        <div class="appointment-container">

            <h1>Book a Medical Appointment</h1>

            <p>
                Please fill in the form below to request an appointment
                at MUST Dispensary.
            </p>


            <!-- Appointment Form -->
            <form id="appointmentForm">

                <!-- Patient Name -->
                <div class="form-group">
                    <label for="fullname">Full Name</label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required>
                </div>


                <!-- Registration Number -->
                <div class="form-group">
                    <label for="registration">Registration Number</label>

                    <input
                        type="text"
                        id="registration"
                        name="registration"
                        placeholder="Enter registration number"
                        required>
                </div>


                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        required>
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                        required>
                </div>


                <!-- Gender -->
                <div class="form-group">
                    <label for="gender">Gender</label>

                    <select id="gender" name="gender" required>

                        <option value="">Select Gender</option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>
                </div>


                <!-- Date -->
                <div class="form-group">
                    <label for="date">Preferred Appointment Date</label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required>
                </div>


                <!-- Time -->
                <div class="form-group">
                    <label for="time">Preferred Appointment Time</label>

                    <input
                        type="time"
                        id="time"
                        name="time"
                        required>
                </div>


                <!-- Service -->
                <div class="form-group">
                    <label for="service">Medical Service</label>

                    <select id="service" name="service" required>

                        <option value="">
                            Select Service
                        </option>

                        <option value="General Consultation">
                            General Consultation
                        </option>

                        <option value="Health Checkup">
                            Health Checkup
                        </option>

                        <option value="Medical Advice">
                            Medical Advice
                        </option>

                        <option value="Laboratory Services">
                            Laboratory Services
                        </option>

                    </select>
                </div>


                <!-- Reason -->
                <div class="form-group">

                    <label for="reason">
                        Reason for Visit
                    </label>

                    <textarea
                        id="reason"
                        name="reason"
                        rows="5"
                        placeholder="Briefly describe the reason for your visit"
                        required>
                    </textarea>

                </div>


                <!-- Submit -->
                <button type="submit" class="appointment-btn">
                    Book Appointment
                </button>

            </form>


            <!-- Confirmation Message -->
            <div id="confirmationMessage"></div>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 MUST Dispensary.
            All Rights Reserved.
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
